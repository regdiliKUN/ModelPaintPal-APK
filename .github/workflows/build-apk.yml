name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - 'main.py'
      - 'buildozer.spec'
      - 'scripts/sync_core.py'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout 安卓端
        uses: actions/checkout@v4

      # 核心层（配色匹配 / 配方计算 / 数据库）不在这个仓库维护，
      # 每次构建从桌面版仓库取一份，避免两份代码各改各的。
      - name: Checkout 桌面版仓库（核心层）
        uses: actions/checkout@v4
        with:
          repository: regdiliKUN/ModelPaintPal
          path: _core

      - name: 同步 app 核心
        run: python3 scripts/sync_core.py --from _core/src/ModelPaintPal/app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip build-essential ccache \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            python3-pip python3-dev python3-venv

      - name: Install buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --upgrade "buildozer==1.6.0"

      - name: Build debug APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Report failure tail
        if: failure()
        run: |
          echo "===== build.log tail ====="
          tail -n 250 build.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModelPaintPal-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
